<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610"><rect width="1100" height="610" fill="#F5F8FB"/><rect x="18" y="18" width="1064" height="574" rx="22" fill="white" stroke="#DDE7EF"/><text x="55" y="82" font-family="Arial,sans-serif" font-size="34" fill="#193B58" font-weight="700">Как выбрать принимающего организатора Амазонии</text><text x="55" y="118" font-family="Arial,sans-serif" font-size="21" fill="#586A78" font-weight="400">Пять проверок перед договором</text><rect x="55" y="146" width="990" height="68" rx="9" fill="#EAF3F8"/><text x="76" y="173" font-family="Arial,sans-serif" font-size="22" fill="#193B58" font-weight="700">1. Кто продает?</text><text x="76" y="200" font-family="Arial,sans-serif" font-size="18" fill="#4E6375" font-weight="400">Бразильская DMC / российский оператор / только B2B</text><rect x="55" y="228" width="990" height="68" rx="9" fill="#F0F5F9"/><text x="76" y="255" font-family="Arial,sans-serif" font-size="22" fill="#193B58" font-weight="700">2. Какой маршрут?</text><text x="76" y="282" font-family="Arial,sans-serif" font-size="18" fill="#4E6375" font-weight="400">Манаус, природная программа и другие регионы</text><rect x="55" y="310" width="990" height="68" rx="9" fill="#EAF3F8"/><text x="76" y="337" font-family="Arial,sans-serif" font-size="22" fill="#193B58" font-weight="700">3. Что частное?</text><text x="76" y="364" font-family="Arial,sans-serif" font-size="18" fill="#4E6375" font-weight="400">Сборка маршрута, трансфер, лодка, гид — отдельно</text><rect x="55" y="392" width="990" height="68" rx="9" fill="#F0F5F9"/><text x="76" y="419" font-family="Arial,sans-serif" font-size="22" fill="#193B58" font-weight="700">4. На каком языке?</text><text x="76" y="446" font-family="Arial,sans-serif" font-size="18" fill="#4E6375" font-weight="400">Менеджер и местный гид могут говорить на разных языках</text><rect x="55" y="474" width="990" height="68" rx="9" fill="#EAF3F8"/><text x="76" y="501" font-family="Arial,sans-serif" font-size="22" fill="#193B58" font-weight="700">5. Что входит?</text><text x="76" y="528" font-family="Arial,sans-serif" font-size="18" fill="#4E6375" font-weight="400">Перелеты, доплаты, сезонные замены и отмены</text></svg>