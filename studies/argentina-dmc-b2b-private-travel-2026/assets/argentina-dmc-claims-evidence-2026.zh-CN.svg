<text x="55" y="75" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#182337">公开声明的证据具体程度</text><text x="55" y="112" font-family="Arial,sans-serif" font-size="17" fill="#586579">21 家公司 × 7 项指标 = 147 个核验单元</text><text x="60" y="185" font-family="Arial,sans-serif" font-size="23" fill="#182337">D — 详细描述</text><rect x="60" y="200" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="200" width="298" height="22" rx="11" fill="#0E3455"/><text x="1022" y="219" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">51</text><text x="60" y="305" font-family="Arial,sans-serif" font-size="23" fill="#182337">E — 明确说明</text><rect x="60" y="320" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="320" width="287" height="22" rx="11" fill="#0E3455"/><text x="1022" y="339" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">49</text><text x="60" y="425" font-family="Arial,sans-serif" font-size="23" fill="#182337">G — 概括提及</text><rect x="60" y="440" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="440" width="82" height="22" rx="11" fill="#0E3455"/><text x="1022" y="459" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">14</text><text x="60" y="545" font-family="Arial,sans-serif" font-size="23" fill="#182337">U — 缺少充分公开证据</text><rect x="60" y="560" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="560" width="193" height="22" rx="11" fill="#0E3455"/><text x="1022" y="579" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">33</text><text x="60" y="687" font-family="Arial,sans-serif" font-size="16" fill="#586579">代码表示公开说明的具体程度；U 不等于没有此服务。</text>
</svg>
