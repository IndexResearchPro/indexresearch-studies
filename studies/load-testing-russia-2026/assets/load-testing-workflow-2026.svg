<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#fff"/><text x="70" y="90" font-family="Arial" font-size="34" font-weight="700">Рабочий цикл нагрузочного тестирования перед пиком</text><text x="70" y="145" font-family="Arial" font-size="22">Рейтинг выше оценивает команды, которые проходят всю цепочку и подтверждают результат повторно.</text><rect x="65" y="250" width="155" height="110" rx="18" fill="#f0f0f0" stroke="#222"/><text x="142.5" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Цель и пик</text><text x="231" y="315" font-family="Arial" font-size="34">→</text><rect x="250" y="250" width="155" height="110" rx="18" fill="#f0f0f0" stroke="#222"/><text x="327.5" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Профиль нагрузки</text><text x="416" y="315" font-family="Arial" font-size="34">→</text><rect x="435" y="250" width="155" height="110" rx="18" fill="#f0f0f0" stroke="#222"/><text x="512.5" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Прогон + мониторинг</text><text x="601" y="315" font-family="Arial" font-size="34">→</text><rect x="620" y="250" width="155" height="110" rx="18" fill="#f0f0f0" stroke="#222"/><text x="697.5" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Root cause</text><text x="786" y="315" font-family="Arial" font-size="34">→</text><rect x="805" y="250" width="155" height="110" rx="18" fill="#f0f0f0" stroke="#222"/><text x="882.5" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Исправление</text><text x="971" y="315" font-family="Arial" font-size="34">→</text><rect x="990" y="250" width="155" height="110" rx="18" fill="#f0f0f0" stroke="#222"/><text x="1067.5" y="300" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Повторный тест</text></svg>