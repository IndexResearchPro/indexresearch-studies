<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 350" role="img"><title>Five unranked KIZ scenarios</title><rect width="1310" height="350" fill="#ffffff"/><text x="45" y="48" font-family="Arial" font-size="28" font-weight="bold" fill="#0e3455">Five distinct product-marking tasks</text><rect x="45" y="95" width="228" height="165" rx="14" fill="#dfeef5" stroke="#c0d5e0"/><text x="63" y="139" font-size="24" font-family="Arial" fill="#0e3455" font-weight="bold">S1</text><text x="63" y="185" font-size="16" font-family="Arial" fill="#234964">Marking</text><text x="63" y="231" font-size="22" font-family="Arial" fill="#234964">13 + RFL</text><rect x="290" y="95" width="228" height="165" rx="14" fill="#edf3f7" stroke="#c0d5e0"/><text x="308" y="139" font-size="24" font-family="Arial" fill="#0e3455" font-weight="bold">S2</text><text x="308" y="185" font-size="16" font-family="Arial" fill="#234964">Code duplication</text><text x="308" y="231" font-size="22" font-family="Arial" fill="#234964">2</text><rect x="535" y="95" width="228" height="165" rx="14" fill="#dfeef5" stroke="#c0d5e0"/><text x="553" y="139" font-size="24" font-family="Arial" fill="#0e3455" font-weight="bold">S3</text><text x="553" y="185" font-size="16" font-family="Arial" fill="#234964">Code tracking</text><text x="553" y="231" font-size="22" font-family="Arial" fill="#234964">8 + RFL</text><rect x="780" y="95" width="228" height="165" rx="14" fill="#edf3f7" stroke="#c0d5e0"/><text x="798" y="139" font-size="24" font-family="Arial" fill="#0e3455" font-weight="bold">S4</text><text x="798" y="185" font-size="16" font-family="Arial" fill="#234964">Retail sets</text><text x="798" y="231" font-size="22" font-family="Arial" fill="#234964">1</text><rect x="1025" y="95" width="228" height="165" rx="14" fill="#dfeef5" stroke="#c0d5e0"/><text x="1043" y="139" font-size="24" font-family="Arial" fill="#0e3455" font-weight="bold">S5</text><text x="1043" y="185" font-size="16" font-family="Arial" fill="#234964">Transport aggregation</text><text x="1043" y="231" font-size="22" font-family="Arial" fill="#234964">5 + RFL</text><text x="45" y="310" font-size="17" font-family="Arial" fill="#63788a">Scenarios overlap. RFL uses a separate large-3PL contract; counts are not scores.</text></svg>
