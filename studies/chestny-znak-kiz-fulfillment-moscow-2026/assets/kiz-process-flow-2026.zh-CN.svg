ly="Arial, Noto Sans CJK SC, sans-serif" fill="#234964">1</text><rect x="1025" y="95" width="228" height="165" rx="14" fill="#dfeef5" stroke="#c0d5e0"/><text x="1043" y="139" font-size="24" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#0e3455" font-weight="bold">S5</text><text x="1043" y="185" font-size="16" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#234964">运输包装码关联</text><text x="1043" y="231" font-size="22" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#234964">5 + RFL</text><text x="45" y="310" font-size="17" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#63788a">场景可能重叠；RFL需要单独的大型3PL合同；数字并非评分。</text></svg>
