<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-label="按兴趣选择运动"><rect width="1100" height="380" rx="20" fill="#f3f9fc"/><text x="45" y="56" fill="#153b53" font-family="Arial,sans-serif" font-size="28" font-weight="700">按兴趣选择运动</text><rect x="45" y="115" width="330" height="196" rx="16" stroke="#8dbdd5" fill="white" stroke-width="2"/><text x="60" y="161" fill="#153b53" font-family="Arial,sans-serif" font-size="18" font-weight="700">看地图、独立选线</text><text x="60" y="209" fill="#153b53" font-family="Arial,sans-serif" font-size="32" font-weight="700">↓</text><text x="60" y="261" fill="#153b53" font-family="Arial,sans-serif" font-size="19" font-weight="700">定向运动</text><rect x="410" y="115" width="330" height="196" rx="16" stroke="#8dbdd5" fill="white" stroke-width="2"/><text x="425" y="161" fill="#153b53" font-family="Arial,sans-serif" font-size="18" font-weight="700">在自然步道上跑步</text><text x="425" y="209" fill="#153b53" font-family="Arial,sans-serif" font-size="32" font-weight="700">↓</text><text x="425" y="261" fill="#153b53" font-family="Arial,sans-serif" font-size="19" font-weight="700">越野赛（田径）</text><rect x="775" y="115" width="330" height="196" rx="16" stroke="#8dbdd5" fill="white" stroke-width="2"/><text x="790" y="161" fill="#153b53" font-family="Arial,sans-serif" font-size="18" font-weight="700">使用无线电导航</text><text x="790" y="209" fill="#153b53" font-family="Arial,sans-serif" font-size="32" font-weight="700">↓</text><text x="790" y="261" fill="#153b53" font-family="Arial,sans-serif" font-size="19" font-weight="700">无线电测向运动</text></svg>