ационная повторяемость занятий</text><rect x="550" y="437" height="32" width="240" rx="5" fill="#7cbbd7"/><text x="800" y="461" fill="#153b53" font-family="Arial,sans-serif" font-size="17" font-weight="700">12%</text><text x="45" y="530" fill="#153b53" font-family="Arial,sans-serif" font-size="17" font-weight="400">Календарная и сезонная гибкость</text><rect x="550" y="505" height="32" width="160" rx="5" fill="#7cbbd7"/><text x="720" y="529" fill="#153b53" font-family="Arial,sans-serif" font-size="17" font-weight="700">8%</text></svg>