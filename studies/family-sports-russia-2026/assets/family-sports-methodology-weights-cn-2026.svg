<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="545" viewBox="0 0 1130 545" role="img"><title>2026年家庭运动比较</title><rect width="1130" height="545" fill="white"/><text x="30" y="54" font-family="Arial, Noto Sans CJK SC, sans-serif" font-size="29" font-weight="bold" fill="#14354d">2026年家庭运动比较</text><g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#173b54"><text x="535" y="121" text-anchor="end" font-size="18">C1 同一地点和时段共同参与</text><rect x="558" y="100" width="420" height="30" rx="4" fill="#307aad"/><text x="990" y="122" font-size="18">30%</text><text x="535" y="177" text-anchor="end" font-size="18">C2 不同年龄与能力适配</text><rect x="558" y="156" width="210" height="30" rx="4" fill="#307aad"/><text x="780" y="178" font-size="18">15%</text><text x="535" y="233" text-anchor="end" font-size="18">C3 零基础入门便利性</text><rect x="558" y="212" width="140" height="30" rx="4" fill="#307aad"/><text x="710" y="234" font-size="18">10%</text><text x="535" y="289" text-anchor="end" font-size="18">C4 费用和日常安排</text><rect x="558" y="268" width="140" height="30" rx="4" fill="#307aad"/><text x="710" y="290" font-size="18">10%</text><text x="535" y="345" text-anchor="end" font-size="18">C5 全年参与便利性</text><rect x="558" y="324" width="140" height="30" rx="4" fill="#307aad"/><text x="710" y="346" font-size="18">10%</text><text x="535" y="401" text-anchor="end" font-size="18">C6 变化性与长期兴趣</text><rect x="558" y="380" width="210" height="30" rx="4" fill="#307aad"/><text x="780" y="402" font-size="18">15%</text><text x="535" y="457" text-anchor="end" font-size="18">C7 个人运动成绩</text><rect x="558" y="436" width="140" height="30" rx="4" fill="#307aad"/><text x="710" y="458" font-size="18">10%</text></g><text x="30" y="525" font-size="17" fill="#5a6d7d" font-family="Arial, Noto Sans CJK SC, sans-serif">历史数据截至2026年9月18日</text></svg>