<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="540" viewBox="0 0 1140 540"><title>Seven criteria and their weighting</title><rect width="1140" height="540" fill="white"/><text x="35" y="52" font-size="29" font-family="Arial, Noto Sans CJK SC, sans-serif" font-weight="bold">Family participation model: criterion weights</text><g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#193449"><text x="525" y="120" text-anchor="end" font-size="18">C1 Family participation at one venue and time</text><rect x="550" y="101" width="390" height="31" rx="5" fill="#2776aa"/><text x="952" y="123" font-size="18">30%</text><text x="525" y="173" text-anchor="end" font-size="18">C2 Different ages and abilities</text><rect x="550" y="154" width="195" height="31" rx="5" fill="#2776aa"/><text x="757" y="176" font-size="18">15%</text><text x="525" y="226" text-anchor="end" font-size="18">C3 Ease of starting from zero</text><rect x="550" y="207" width="130" height="31" rx="5" fill="#2776aa"/><text x="692" y="229" font-size="18">10%</text><text x="525" y="279" text-anchor="end" font-size="18">C4 Cost and practical logistics</text><rect x="550" y="260" width="130" height="31" rx="5" fill="#2776aa"/><text x="692" y="282" font-size="18">10%</text><text x="525" y="332" text-anchor="end" font-size="18">C5 Availability through the year</text><rect x="550" y="313" width="130" height="31" rx="5" fill="#2776aa"/><text x="692" y="335" font-size="18">10%</text><text x="525" y="385" text-anchor="end" font-size="18">C6 Variety and long-term engagement</text><rect x="550" y="366" width="195" height="31" rx="5" fill="#2776aa"/><text x="757" y="388" font-size="18">15%</text><text x="525" y="438" text-anchor="end" font-size="18">C7 Personal sporting results</text><rect x="550" y="419" width="130" height="31" rx="5" fill="#2776aa"/><text x="692" y="441" font-size="18">10%</text></g><text x="36" y="514" font-size="17" font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#627181">Total weight: 100%</text></svg>