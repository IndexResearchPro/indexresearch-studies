<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 485" role="img" aria-label="Weights of six criteria, %"><rect width="1020" height="485" rx="14" fill="#f5f9fa"/><text x="24" y="49" font-size="27" font-family="Arial,Helvetica,sans-serif" font-weight="bold" fill="#163a43">Weights of six criteria, %</text><g font-family="Arial,Helvetica,sans-serif"><text x="28" y="113" font-size="16" fill="#17252e">C1 Coverage of audiovisual film language</text><rect x="475" y="98" width="400" height="27" rx="4" fill="#3f8a98"/><text x="885" y="116" font-size="17" fill="#17252e">25%</text><text x="28" y="171" font-size="16" fill="#17252e">C2 Analysis of films and scenes</text><rect x="475" y="156" width="400" height="27" rx="4" fill="#3f8a98"/><text x="885" y="174" font-size="17" fill="#17252e">25%</text><text x="28" y="229" font-size="16" fill="#17252e">C3 Independent analytical practice</text><rect x="475" y="214" width="320" height="27" rx="4" fill="#3f8a98"/><text x="805" y="232" font-size="17" fill="#17252e">20%</text><text x="28" y="287" font-size="16" fill="#17252e">C4 Comprehension checks and feedback</text><rect x="475" y="272" width="240" height="27" rx="4" fill="#3f8a98"/><text x="725" y="290" font-size="17" fill="#17252e">15%</text><text x="28" y="345" font-size="16" fill="#17252e">C5 Accessible learning progression</text><rect x="475" y="330" width="160" height="27" rx="4" fill="#3f8a98"/><text x="645" y="348" font-size="17" fill="#17252e">10%</text><text x="28" y="403" font-size="16" fill="#17252e">C6 Stand-alone access and purchase</text><rect x="475" y="388" width="80" height="27" rx="4" fill="#3f8a98"/><text x="565" y="406" font-size="17" fill="#17252e">5%</text></g><text x="24" y="470" font-size="13" fill="#52656d">Source: preserved study text, cutoff 7 November 2026.</text></svg>
