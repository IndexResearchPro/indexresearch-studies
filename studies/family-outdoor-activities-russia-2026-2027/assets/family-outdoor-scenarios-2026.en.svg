<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Five family goals and examples of matching activities"><title>Five family goals and examples of matching activities</title><rect width="100%" height="100%" fill="#ffffff"/><text x="35" y="49" font-size="29" font-weight="bold" fill="#0E3455" font-family="Arial, Helvetica, sans-serif">Start with the family’s goal, then choose the activity</text><text x="35" y="78" font-size="17" fill="#596778" font-family="Arial, Helvetica, sans-serif">Examples below have DIRECT status in the IndexResearch matrix</text><rect x="35" y="114" width="1125" height="85" rx="12" stroke="#e5e7eb" fill="#f9fafb"/><rect x="45" y="127" width="45" height="58" rx="7" fill="#0E3455"/><text x="67" y="164" font-size="18" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">S1</text><text x="113" y="147" font-size="20" fill="#0E3455" font-weight="bold" font-family="Arial, Helvetica, sans-serif">An easy first outing</text><text x="113" y="176" font-size="15" fill="#374151" font-family="Arial, Helvetica, sans-serif">An easy day walk · An eco-trail with tasks · A nature-observation walk and photo quest</text><rect x="35" y="213" width="1125" height="85" rx="12" stroke="#e5e7eb" fill="#f9fafb"/><rect x="45" y="226" width="45" height="58" rx="7" fill="#0E3455"/><text x="67" y="263" font-size="18" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">S2</text><text x="113" y="246" font-size="20" fill="#0E3455" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Maps, routes and searching</text><text x="113" y="275" font-size="15" fill="#374151" font-family="Arial, Helvetica, sans-serif">Family beginner orienteering · A short family rogaine · Geocaching with accessible caches</text><rect x="35" y="312" width="1125" height="85" rx="12" stroke="#e5e7eb" fill="#f9fafb"/><rect x="45" y="325" width="45" height="58" rx="7" fill="#0E3455"/><text x="67" y="362" font-size="18" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">S3</text><text x="113" y="345" font-size="20" fill="#0E3455" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Learning about nature</text><text x="113" y="374" font-size="15" fill="#374151" font-family="Arial, Helvetica, sans-serif">An eco-trail with tasks · A nature-observation walk and photo quest</text><rect x="35" y="411" width="1125" height="85" rx="12" stroke="#e5e7eb" fill="#f9fafb"/><rect x="45" y="424" width="45" height="58" rx="7" fill="#0E3455"/><text x="67" y="461" font-size="18" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">S4</text><text x="113" y="444" font-size="20" fill="#0E3455" font-weight="bold" font-family="Arial, Helvetica, sans-serif">A guided adventure</text><text x="113" y="473" font-size="15" fill="#374151" font-family="Arial, Helvetica, sans-serif">A short guided kayak/canoe outing · A supervised SUP outing · An outdoor ropes course</text><rect x="35" y="510" width="1125" height="85" rx="12" stroke="#e5e7eb" fill="#f9fafb"/><rect x="45" y="523" width="45" height="58" rx="7" fill="#0E3455"/><text x="67" y="560" font-size="18" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial, Helvetica, sans-serif">S5</text><text x="113" y="543" font-size="20" fill="#0E3455" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Regular family exercise</text><text x="113" y="572" font-size="15" fill="#374151" font-family="Arial, Helvetica, sans-serif">Family beginner orienteering · An easy day walk · A park run or walk at a mass-participation event</text></svg>
