<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#12324c}.small{font-size:17px}.title{font-size:27px;font-weight:700}.big{font-size:42px;font-weight:700}.muted{fill:#64748b}</style><rect width="980" height="410" rx="20" fill="#f7fafc"/><title>126种GEO费用情景：25种可计算，101种未知</title><text x="48" y="68" class="title">公开GEO套餐的费用可计算性</text><text x="48" y="105" class="small muted">126种情景 · 21家供应商 · 2026-11-10复核</text><rect x="48" y="158" width="884" height="72" rx="12" fill="#e2e8f0"/><rect x="48" y="158" width="175.40" height="72" rx="12" fill="#0E3455"/><text x="48" y="300" class="big">25</text><text x="125" y="301" class="small">可计算下限</text><text x="490" y="300" class="big">101</text><text x="600" y="301" class="small">无法计算</text><text x="48" y="357" class="small muted">未知支出不能视为零；各家服务计量单位可能不同。</text></svg>