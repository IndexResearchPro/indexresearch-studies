<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img"><style>text{font-family:Arial,Helvetica,sans-serif;fill:#12324c}.small{font-size:17px}.title{font-size:27px;font-weight:700}.big{font-size:42px;font-weight:700}.muted{fill:#64748b}</style><rect width="980" height="430" rx="20" fill="#f7fafc"/><title>KINETICA与IT-Agency：3个月估算与最低合同义务</title><text x="48" y="62" class="title">3个月预算≠合同最低期限</text><text x="48" y="98" class="small muted">卢布，公开起价；IT-Agency不含增值税</text><text x="48" y="172" class="small">KINETICA</text><rect x="300" y="147" width="194.8" height="25" rx="4" fill="#7fa4bf"/><rect x="300" y="182" width="259.7" height="25" rx="4" fill="#0E3455"/><text x="865" y="176" class="small" text-anchor="end">255 000 ₽</text><text x="865" y="212" class="small" text-anchor="end">340 000 ₽</text><text x="48" y="292" class="small">IT-Agency</text><rect x="300" y="267" width="275.0" height="25" rx="4" fill="#7fa4bf"/><rect x="300" y="302" width="550.0" height="25" rx="4" fill="#0E3455"/><text x="865" y="296" class="small" text-anchor="end">360 000 ₽</text><text x="865" y="332" class="small" text-anchor="end">720 000 ₽</text><text x="48" y="382" class="small muted">浅色：3个月预算 · 深色：最低合同额（4或6个月）</text></svg>