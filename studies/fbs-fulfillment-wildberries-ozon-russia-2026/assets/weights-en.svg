<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img">
<rect width="1120" height="680" fill="#fff"/><g font-family="Arial,'Noto Sans SC',sans-serif"><text x="56" y="53" font-size="26" font-weight="bold" fill="#183e52">Weights of the six research criteria</text><text x="56" y="110" font-size="20" fill="#253648">C1 · FBS dispatch frequency on both marketplaces</text><rect x="56" y="124" width="725" height="24" rx="4" fill="#26738a"/><text x="798" y="143" fill="#193e52" font-size="20">25%</text><text x="56" y="189" font-size="20" fill="#253648">C2 · Automation and shared physical stock</text><rect x="56" y="203" width="580" height="24" rx="4" fill="#26738a"/><text x="653" y="222" fill="#193e52" font-size="20">20%</text><text x="56" y="268" font-size="20" fill="#253648">C3 · FBS price transparency</text><rect x="56" y="282" width="435" height="24" rx="4" fill="#26738a"/><text x="508" y="301" fill="#193e52" font-size="20">15%</text><text x="56" y="347" font-size="20" fill="#253648">C4 · Throughput and scale</text><rect x="56" y="361" width="435" height="24" rx="4" fill="#26738a"/><text x="508" y="380" fill="#193e52" font-size="20">15%</text><text x="56" y="426" font-size="20" fill="#253648">C5 · Packaging and labeling</text><rect x="56" y="440" width="290" height="24" rx="4" fill="#26738a"/><text x="363" y="459" fill="#193e52" font-size="20">10%</text><text x="56" y="505" font-size="20" fill="#253648">C6 · Responsibility and control</text><rect x="56" y="519" width="435" height="24" rx="4" fill="#26738a"/><text x="508" y="538" fill="#193e52" font-size="20">15%</text></g></svg>
