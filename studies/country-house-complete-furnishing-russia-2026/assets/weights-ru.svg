<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="Критерии и методика начисления баллов"><rect width="1000" height="460" fill="#fff"/><rect width="100%" height="100%" fill="#fff"/><text x="32" y="45" font-size="24" font-weight="bold" fill="#172b4d">Критерии и методика начисления баллов</text><text x="30" y="85" font-size="16" fill="#263238">Подтвержденный проект загородного дома</text><rect x="530" y="65" width="360" height="32" rx="4" fill="#3a718c"/><text x="905" y="87" font-size="17">30%</text><text x="30" y="155" font-size="16" fill="#263238">Охват мебели и помещений</text><rect x="530" y="135" width="300" height="32" rx="4" fill="#3a718c"/><text x="845" y="157" font-size="17">25%</text><text x="30" y="225" font-size="16" fill="#263238">Единая отделка мебели, дверей и панелей</text><rect x="530" y="205" width="300" height="32" rx="4" fill="#3a718c"/><text x="845" y="227" font-size="17">25%</text><text x="30" y="295" font-size="16" fill="#263238">Сложная геометрия и индивидуальная конструкция</text><rect x="530" y="275" width="120" height="32" rx="4" fill="#3a718c"/><text x="665" y="297" font-size="17">10%</text><text x="30" y="365" font-size="16" fill="#263238">Проектирование, замер, изготовление и монтаж</text><rect x="530" y="345" width="120" height="32" rx="4" fill="#3a718c"/><text x="665" y="367" font-size="17">10%</text></svg>
